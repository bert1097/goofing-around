<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Week by Week</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div class="banner" id="banner" role="note">Sample data. Everything here is invented.</div>
  <div class="top-inner">
  <div class="top-row">
    <h1 id="title">Week by week</h1>
    <div class="tools">
      <label class="jump">Week
        <select id="jump" aria-label="Jump to week"></select>
      </label>
      <button type="button" id="theme" class="theme">Auto</button>
      <a href="#data" id="addbtn" class="btn primary">Add your data</a>
    </div>
  </div>
  <div class="key" id="key" role="group" aria-label="Show categories"></div>
  <div class="colheads" id="colheads"></div>
  </div>
</header>
<main id="app"><p class="loading">Loading…</p></main>
<script type="module" src="js/app.js"></script>
</body>
</html>
